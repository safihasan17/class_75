<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .red{
        color: red;
    }

    .font{
        font-weight: bold;
        text-transform: uppercase;
    }

    
</style>
<body>
    

    <p>paragraph 1</p>
    <p class="red">paragraph 2</p>
    <p>paragraph 4</p>
    <p>paragraph 5</p>
    <p>paragraph 6</p>
    <p>paragraph 7</p>
     <button class="add-class">Red Text</button>
     <button class="remove-class"> Black Text</button>
     <button class="toggle-class"> Black Text</button>

     <script src="js/jquery-4.0.0.min.js"></script>

     <script>
        $(".add-class").click(()=>{
            $("p:nth-child(odd)").addClass("red font");
        })

        $(".remove-class").click(()=>{
            $("p:nth-child(odd)").removeClass("red font");
        })

         $(".toggle-class").click(()=>{
            $("p:nth-child(odd)").toggleClass("red font");
        })

        console.log($("p:nth-child(2)").hasClass("red"));


     </script>
</body>
</html>
